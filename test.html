    <style>
        
*,
*::before,
*::after{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
/*premimum section */
.premimum_wrapper{
padding: 150px 0px;
}
.premimum_content{
      display: grid;
  grid-template-columns: 1fr 1fr; /* Two equal columns */
  gap: 30px;  
}
.premimum_left h3{
    font-size: 40px;
font-style: normal;
font-weight: 500;
line-height: 120%; /* 48px */
letter-spacing: 1.2px;
}
.premimum_right{
    display: flex;
    flex-direction: column;
    gap: 30px;
}
.premimum_right_content h4{
font-size: 22px;
font-style: normal;
font-weight: 700;
line-height: 28px;
}
.premimum_right_content p{
font-size: 22px;
font-style: normal;
font-weight: 400;
line-height: 28px;
}
.premimum_right_content{
    display: flex;
    flex-direction: column;
    gap: 30px;
}
.premimum_right_content_head h3{
color: #FF8000;
font-size: 16px;
font-style: normal;
font-weight: 700;
line-height: 24px;
}
.premimum_right_content_button{
    display: flex;
    gap: 10px;
    align-items: center;

}
.premimum_right_content_button svg{
    display: none;
     transform: translateX(-10px);
    transition: transform 0.5s ease;
}
.premimum_right_content_button:hover svg{
    display: block;
     transform: translateX(0)
    
}

.car_expander {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    height: 880px;
    transition: grid-template-columns 0.6s ease;
    overflow: hidden;
}

.car_expander:has(.car_expander-img:nth-child(1):hover) {
    grid-template-columns: 2fr 0.5fr 0.5fr;
}

.car_expander:has(.car_expander-img:nth-child(2):hover) {
    grid-template-columns: 0.5fr 2fr 0.5fr;
}

.car_expander:has(.car_expander-img:nth-child(3):hover) {
    grid-template-columns: 0.5fr 0.5fr 2fr;
}

.car_expander-img {
    overflow: hidden;
    position: relative;
}

.car_expander-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
}

.car_expander-img:hover img {
    transform: scale(1.05);
}
.car_expander_content{
   position: absolute;
    inset: 0;              /* top:0; right:0; bottom:0; left:0 */
    padding: 60px;
    display: flex;
   
    color: #fff;
    z-index: 2;
    display: flex;
    flex-direction: column;
   justify-content: space-between;
}
.expander_overlay-svg{
  
}
.car_expander_bottom h6{
font-family: "Darker Grotesque";
font-size: 30px;
font-style: normal;
font-weight: 500;
line-height: 140%;
}
.expander-car-name{
    display: flex;
    gap: 20px;
}
.expander-car-name{
    font-family: "IvyOra Display";
font-size: 40px;
font-style: normal;
font-weight: 500;
line-height: 120%; /* 48px */
letter-spacing: 1.2px;
display: flex;
gap: 20px;
align-items: flex-end;
}
.car_expander_bottom{
    display: flex;
    flex-direction: column;
    gap: 20px;
}
h6,h3{
    margin: 0;
}





/*arrow_down*/
.arrow_down_wrap{
    position: relative;
    width: 60px;
    height: 60px;
}

/* bars sit fixed in place above the box, hidden until hover — no motion, no fade */
.trail-bars{
    position: absolute;
    top: 0;
    left: 0;
    width: 60px;
    /* height: 30px; */
    height: 60px;
    display: flex;
    /* flex-direction: column; */
    gap: 5px;
}
.trail-bars .trail-bar{
    opacity: 0;
   
    width: 5px;
    height: 100%;
    background-color: #FFF;    
}

.arrow_down_wrap:hover .trail-bar1{
    opacity: .4;
}
.arrow_down_wrap:hover .trail-bar2{
    opacity: .6;
}
.arrow_down_wrap:hover .trail-bar3{
    opacity: .8;
}
/* only the box itself animates, sliding down 30px */
.top_arrow_down{
    position: relative;
    width: 60px;
    height: 60px;
    overflow: visible;
    transition: transform 0.3s ease;
    border: 1px solid white;
   display: flex;
   align-items: center;
    justify-content: center;
    background-color: #FFF;
}
.arrow_down_wrap:hover .top_arrow_down{
    transform: translatex(30px);
    background-color: #FFF;
}
.top_arrow_down svg path{
    transition: fill 0.3s ease;
}
.top_arrow_down:hover svg path{
    fill: black;
}
.expander-car-name1{
    width:430px;
   
}
.top_arrow_down{
    width: 70px;
}
