<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Path Square</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f4f4f4;
    }

    .square {
        width: 250px;
        height: 250px;
        background: #4CAF50;

        /* Square Clip Path */
/* clip-path: polygon(
     100% 0,
        100% 0,
        100% 100%,
        0 100%
); */

/* clip-path: polygon(75% 0%, 100% 50%, 75% 100%, 0% 100%,25% 50%, 0% 0%); */
clip-path: polygon(75% 0, 100% 50%, 75% 100%,0% 100%, 25% 50%,0% 0%);
    }
</style>
</head>
<body>

<div class="square"></div>

</body>
</html>
